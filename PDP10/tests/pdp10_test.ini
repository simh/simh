; RDTIM must measure the active interval, not the next WRINT interval.
; Run actual CPU instructions at a fixed rate, without a guest OS or host-clock
; dependencies.  Memory operands and ASSERT limits are octal; STEP counts
; are decimal.  Stop reason 1 is the expected HALT (STOP_HALT).
set on
on error exit 1
on afail exit 1
set cpu noidle
set clock nocalibrate=1m

; RESET initializes a 17*4096 tick interval.  Exercise WRINT before the first
; service and after at least one service, including instruction-timed KLAD.
call wrint TOPS-10 200000 0
call wrint TOPS-10 220000 0
call wrint TOPS-10 200000 25000
call wrint TOPS-10 220000 25000
call wrint TOPS-20 200000 25000
call wrint TOPS-20 220000 25000
call wrint ITS 200000 25000
call wrint ITS 220000 25000
call wrint KLAD 200000 25000
call wrint KLAD 220000 25000
call propagation 200000
call propagation 220000

; Changing CPU mode programs the next interval via tim_set_mod, but must not
; change interpolation of the pending interval either.
call model TOPS-10 TOPS-20
call model TOPS-20 TOPS-10
call model TOPS-10 ITS
call model ITS KLAD
call model KLAD TOPS-10

set cpu tops-10
reset
echo PDP-10 active timer interval tests passed
exit 0

:wrint
set on
on error exit 1
on afail exit 1
echo WRINT: %1 next=%2 advance=%3
set cpu %1
reset
if "%3" != "0" call advance %3

; Two RDTIMs separated by WRINT take only two instruction cycles.  The change
; must be nonnegative and much less than the 4096 hardware ticks (about 1 ms)
; separating the old and new interval lengths.  SUB's unsigned 36-bit result
; makes a backwards step fail the same upper-bound assertion as a forward jump.
dep -m 100 RDTIM 1000
dep -m 101 WRINT 1002
dep 1002 %2
call finish 100
return

:model
set on
on error exit 1
on afail exit 1
on 1 ignore
echo CPU model: %1 to %2
set cpu %1
reset
call advance 25000
dep -m 100 RDTIM 1000
dep -m 101 HALT 102
go 100
assert cpu PC=102
set cpu %2
call finish 102
return

:advance
set on
on error exit 1
on step ignore
dep -m 200 JRST 200
dep pc 200
step %1
return OK

:propagation
set on
on error exit 1
on afail ex cpu REG[2]; ex 1000-1005; exit 1
on 1 ignore
; After WRINT, the service routine must adopt the newly scheduled duration.
; Measure across at least one service: 25000 instructions at 1M IPS advance
; about 102500 hardware ticks.  Allow rounding, but not a 4096-tick jump.
call wrint TOPS-10 %1 25000
call advance 25000
dep -m 102 RDTIM 1004
dep -m 103 MOVE 2,1005
dep -m 104 SUB 2,1001
go 102
assert cpu PC=106
assert cpu REG[2]>=307160
assert cpu REG[2]<311130
return

:finish
set on
on error exit 1
on afail ex cpu REG[1]; ex 1000-1005; exit 1
on 1 ignore
dep -m 102 RDTIM 1004
dep -m 103 MOVE 1,1005
dep -m 104 SUB 1,1001
dep -m 105 HALT 106
go %1
assert cpu PC=106
assert cpu REG[1]<1000
return
